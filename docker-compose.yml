services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      VAAKKU_DEVICE: cpu
  ui:
    build: .
    command:
      - streamlit
      - run
      - app/streamlit_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
    ports:
      - "8501:8501"
    environment:
      VAAKKU_API_URL: http://api:8000
    depends_on:
      - api
