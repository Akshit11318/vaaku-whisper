# Pipeline check on a small slice. Not a quality benchmark.
purpose: pipeline_validation
run_name: quick-pipeline
seed: 42
output_dir: ${VAAKKU_ARTIFACT_DIR:-artifacts}/runs
base_model_id: openai/whisper-small
model_init: pretrained
languages: [ta, te, hi, kn, ml]
train_manifest: ${VAAKKU_DATA_DIR:-data}/prepared/train.jsonl
validation_manifest: ${VAAKKU_DATA_DIR:-data}/prepared/validation.jsonl
max_train_samples: 8
max_eval_samples: 4
num_epochs: 1
max_steps: 2
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 0.0001
weight_decay: 0.0
warmup_steps: 0
max_grad_norm: 1.0
precision: auto
gradient_checkpointing: false
num_workers: 0
lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules: [q_proj, v_proj]
  bias: none
eval_steps: 2
save_steps: 2
early_stopping_patience: null
selection_metric: eval_loss
logging:
  level: INFO
  dir: ${VAAKKU_ARTIFACT_DIR:-artifacts}/logs
