# CPU pipeline test with a random tiny Whisper. Not a quality benchmark.
purpose: pipeline_validation
run_name: smoke
seed: 7
output_dir: artifacts/smoke
base_model_id: openai/whisper-small
model_init: tiny_random
synthetic: true
synthetic_train_samples: 4
synthetic_eval_samples: 2
languages: [hi]
num_epochs: 1
max_steps: 1
per_device_train_batch_size: 2
per_device_eval_batch_size: 2
gradient_accumulation_steps: 1
learning_rate: 0.0001
weight_decay: 0.0
warmup_steps: 0
precision: fp32
gradient_checkpointing: false
num_workers: 0
lora:
  r: 4
  alpha: 8
  dropout: 0.0
  target_modules: [q_proj, v_proj]
  bias: none
eval_steps: 1
save_steps: 1
early_stopping_patience: null
selection_metric: eval_loss
logging:
  level: INFO
  dir: artifacts/smoke-logs
