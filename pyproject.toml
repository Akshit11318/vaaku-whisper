[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vaakku"
version = "0.1.0"
description = "Vaakku — Open Indic Speech. Multilingual ASR for Tamil, Telugu, Hindi, Kannada, and Malayalam."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Vaakku contributors" }]
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "numpy>=1.26",
  "soundfile>=0.12",
  "scipy>=1.11",
  "jiwer>=3.0",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "python-multipart>=0.0.12",
  "huggingface_hub>=0.26",
  "transformers>=4.46",
  "peft>=0.13",
  "accelerate>=1.0",
  "datasets>=3.0",
  "streamlit>=1.40",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "httpx>=0.27",
]
gpu = [
  "torch>=2.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: crosses module boundaries or starts the app",
  "gpu: requires a CUDA device",
]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts", "app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"src/vaakku/api/app.py" = ["B008"]

[tool.coverage.run]
source = ["vaakku"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["vaakku"]
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false
